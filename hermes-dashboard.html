<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes 看板</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--orange:#d2991d;--red:#f85149;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",monospace;padding:20px;min-height:100vh}
h1{font-size:20px;margin-bottom:20px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.card h2{font-size:13px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;letter-spacing:.5px}
.stat{font-size:28px;font-weight:700}
.stat.small{font-size:20px}
.label{font-size:11px;color:var(--muted);margin-top:4px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:120px}
.bar{height:4px;border-radius:2px;background:var(--border);margin-top:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .5s}
.bar-fill.blue{background:var(--accent)}
.bar-fill.green{background:var(--green)}
.bar-fill.orange{background:var(--orange)}
.timeline{max-height:400px;overflow-y:auto}
.timeline-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;align-items:center}
.timeline-item:last-child{border:none}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;white-space:nowrap}
.tag.api{background:#1f4e79;color:var(--accent)}
.tag.tool{background:#1e4d2b;color:var(--green)}
.time{color:var(--muted);font-size:11px;white-space:nowrap;width:50px}
.detail{flex:1;min-width:0}
.detail strong{color:var(--text)}
.secondary{color:var(--muted);font-size:11px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.live{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:6px;animation:pulse 1.5s infinite}
</style>
</head>
<body>
<h1><span class="live"></span>Hermes 看板</h1>
<div class="grid">
  <div class="card">
    <h2>🤖 当前模型</h2>
    <div class="stat small" id="model">—</div>
    <div class="label" id="provider">—</div>
  </div>
  <div class="card">
    <h2>📊 Token 用量</h2>
    <div class="row">
      <div class="col"><div class="stat small" id="tok-in">0</div><div class="label">输入</div></div>
      <div class="col"><div class="stat small" id="tok-out">0</div><div class="label">输出</div></div>
      <div class="col"><div class="stat small" id="tok-total">0</div><div class="label">总计</div></div>
    </div>
    <div class="bar"><div class="bar-fill blue" id="tok-bar" style="width:0%"></div></div>
    <div class="label" id="tok-detail">—</div>
  </div>
  <div class="card">
    <h2>⚡ 性能</h2>
    <div class="row">
      <div class="col"><div class="stat small" id="latency">0s</div><div class="label">最新延迟</div></div>
      <div class="col"><div class="stat small" id="cache">0%</div><div class="label">缓存命中</div></div>
      <div class="col"><div class="stat small" id="calls">0</div><div class="label">API调用</div></div>
    </div>
  </div>
  <div class="card">
    <h2>📁 会话</h2>
    <div class="stat small" id="session" style="font-size:12px;word-break:break-all">—</div>
    <div class="label">Session ID</div>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h2>🔧 工具调用流</h2>
    <div class="timeline" id="tool-list">—</div>
  </div>
  <div class="card">
    <h2>📡 API 调用流</h2>
    <div class="timeline" id="api-list">—</div>
  </div>
</div>

<script>
async function refresh(){
  try{
    const [s,e]=await Promise.all([
      fetch("http://localhost:8090/api/stats").then(r=>r.json()),
      fetch("http://localhost:8090/api/events").then(r=>r.json())
    ]);
    document.getElementById("model").textContent=s.model||"—";
    document.getElementById("provider").textContent=(s.provider||"—")+"  ·  API #"+s.total_calls;
    document.getElementById("tok-in").textContent=(s.total_in||0).toLocaleString();
    document.getElementById("tok-out").textContent=(s.total_out||0).toLocaleString();
    document.getElementById("tok-total").textContent=(s.total_tokens||0).toLocaleString();
    let ratio=s.total_in>0?Math.round(s.total_out/s.total_in*100):0;
    document.getElementById("tok-bar").style.width=Math.min(ratio,100)+"%";
    document.getElementById("tok-detail").textContent="输出/输入比: "+ratio+"%  ·  累计 "+s.total_calls+" 次调用";
    document.getElementById("latency").textContent=(s.last_latency||0).toFixed(1)+"s";
    document.getElementById("cache").textContent=(s.last_cache||0)+"%";
    document.getElementById("calls").textContent=s.total_calls||0;
    document.getElementById("session").textContent=s.session||"—";

    // 工具流
    let tools=s.tools||[];
    if(tools.length===0){document.getElementById("tool-list").innerHTML="<div class='secondary'>等待中...</div>";}
    else{
      document.getElementById("tool-list").innerHTML=tools.slice(0,20).map(t=>
        `<div class="timeline-item"><span class="time">${t.time}</span><span class="tag tool">${t.tool}</span><span class="detail"><span class="secondary">${t.duration.toFixed(2)}s  ·  ${t.chars.toLocaleString()} 字符</span></span></div>`
      ).join("");
    }

    // API 流
    let apis=e.filter(x=>x.type==="api").slice(-20).reverse();
    if(apis.length===0){document.getElementById("api-list").innerHTML="<div class='secondary'>等待中...</div>";}
    else{
      document.getElementById("api-list").innerHTML=apis.map(a=>
        `<div class="timeline-item"><span class="time">${a.time}</span><span class="tag api">#${a.call}</span><span class="detail"><strong>${a.model}</strong><br><span class="secondary">in:${a.in.toLocaleString()} out:${a.out.toLocaleString()}  ·  ${a.latency.toFixed(1)}s  ·  缓存${a.cache}%</span></span></div>`
      ).join("");
    }
  }catch(e){console.error(e)}
  setTimeout(refresh,2000);
}
refresh();
</script>
</body>
</html>
